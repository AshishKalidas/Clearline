[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clearline"
version = "0.1.0"
description = "Evidence-first EFT reconciliation with a bounded agent and human review"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "reportlab>=4.2,<5", "pdfplumber>=0.11,<1", "anthropic>=0.49,<1",
  "openai>=1.65,<3", "mcp>=1.9,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]
local = ["sentence-transformers>=3.4,<6"]

[tool.setuptools.packages.find]
include = ["backend*", "evals*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["._*", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/*.py" = ["B008"]
"backend/app/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["backend/app"]

[tool.coverage.report]
show_missing = true
