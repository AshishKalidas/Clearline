name: Clearline release gates
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history for credentials
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all --full-history' --redact=100 --no-banner

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: stub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and start services
        run: make up
      - name: Check backend contracts and coverage
        run: make lint typecheck test
      - name: Verify published evidence
        run: make evidence-check
      - name: Check MCP against an empty ledger
        run: make mcp-check
      - name: Evaluate retrieval on and off
        run: make eval
      - name: Seed the browser workspace
        run: make seed
      - name: Check MCP against seeded records
        run: make mcp-check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check web types, units and formatting
        run: npm ci && npm run build && npm test && npx prettier --check src e2e '*.ts' '*.json' index.html
        working-directory: web
      - name: Exercise browser workflows against nginx
        run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
      - name: Collect service diagnostics
        if: failure()
        continue-on-error: true
        run: docker compose logs --no-color > compose.log
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure
          path: |
            compose.log
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop services
        if: always()
        run: make down
