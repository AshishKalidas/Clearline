name: Clearline release gates
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: make lint typecheck test
      - run: make eval
      - run: make mcp-check
      - run: make seed
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build && npm test && npx prettier --check src e2e '*.ts' '*.json' index.html
        working-directory: web
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
      - if: always()
        run: docker compose logs && make down
